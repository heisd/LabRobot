<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Wheeltec S300 Dashboard</title>
  <link rel="stylesheet" href="style.css" />
  <script src="https://cdn.jsdelivr.net/npm/roslib@1.3.0/build/roslib.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <header>
    <h1>Wheeltec S300 Dashboard</h1>
    <div class="conn">
      <label for="ws-url">rosbridge</label>
      <input id="ws-url" type="text" />
      <button id="ws-connect">连接</button>
      <span id="ws-status" class="status status-off">未连接</span>
    </div>
  </header>

  <main>
    <section class="card">
      <h2>遥测</h2>
      <div class="grid">
        <div class="metric">
          <div class="metric-label">电池电压</div>
          <div id="m-voltage" class="metric-value">— V</div>
        </div>
        <div class="metric">
          <div class="metric-label">充电中</div>
          <div id="m-charging" class="metric-value">—</div>
        </div>
        <div class="metric">
          <div class="metric-label">充电电流</div>
          <div id="m-charge-current" class="metric-value">— A</div>
        </div>
        <div class="metric">
          <div class="metric-label">急停 (red flag)</div>
          <div id="m-red" class="metric-value">—</div>
        </div>
        <div class="metric">
          <div class="metric-label">自检数据</div>
          <div id="m-selfcheck" class="metric-value">—</div>
        </div>
        <div class="metric">
          <div class="metric-label">里程计 X / Y</div>
          <div id="m-odom-xy" class="metric-value">—</div>
        </div>
        <div class="metric">
          <div class="metric-label">里程计 Yaw</div>
          <div id="m-odom-yaw" class="metric-value">— °</div>
        </div>
        <div class="metric">
          <div class="metric-label">IMU R / P / Y</div>
          <div id="m-imu-rpy" class="metric-value">—</div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>超声波 (m)</h2>
      <div id="sonar-grid" class="sonar-grid">
        <div class="sonar"><span class="sl">A</span><span id="s-a" class="sv">—</span></div>
        <div class="sonar"><span class="sl">B</span><span id="s-b" class="sv">—</span></div>
        <div class="sonar"><span class="sl">C</span><span id="s-c" class="sv">—</span></div>
        <div class="sonar"><span class="sl">D</span><span id="s-d" class="sv">—</span></div>
        <div class="sonar"><span class="sl">E</span><span id="s-e" class="sv">—</span></div>
        <div class="sonar"><span class="sl">F</span><span id="s-f" class="sv">—</span></div>
        <div class="sonar"><span class="sl">G</span><span id="s-g" class="sv">—</span></div>
        <div class="sonar"><span class="sl">H</span><span id="s-h" class="sv">—</span></div>
      </div>
    </section>

    <section class="card">
      <h2>速度控制 (/cmd_vel)</h2>
      <div class="teleop">
        <div class="teleop-grid">
          <button class="tk" data-vx="1" data-wz="0">▲</button>
          <button class="tk" data-vx="1" data-wz="1">↖</button>
          <button class="tk" data-vx="0" data-wz="1">◀</button>
          <button class="tk" data-stop="1">■</button>
          <button class="tk" data-vx="0" data-wz="-1">▶</button>
          <button class="tk" data-vx="-1" data-wz="0">▼</button>
          <button class="tk" data-vx="1" data-wz="-1">↗</button>
          <button class="tk" data-vx="-1" data-wz="1">↙</button>
          <button class="tk" data-vx="-1" data-wz="-1">↘</button>
        </div>
        <div class="teleop-sliders">
          <label>线速度上限 <span id="lin-val">0.30</span> m/s
            <input id="lin-max" type="range" min="0" max="1.5" step="0.05" value="0.3" />
          </label>
          <label>角速度上限 <span id="ang-val">1.00</span> rad/s
            <input id="ang-max" type="range" min="0" max="3" step="0.1" value="1.0" />
          </label>
          <label>
            <input id="hold-mode" type="checkbox" checked />
            连发 (松开停)
          </label>
          <div class="cmd-readout">
            当前指令: <span id="cmd-current">vx=0.00, wz=0.00</span>
          </div>
        </div>
      </div>
    </section>

    <section class="card">
      <h2>参数 (/wheeltec_robot)</h2>
      <div class="params">
        <div class="param-row">
          <label>节点</label>
          <input id="param-node" type="text" value="/wheeltec_robot" />
          <button id="param-refresh">读取当前值</button>
        </div>
        <div id="param-list">
          <div class="param-row" data-param="odom_x_scale">
            <label>odom_x_scale</label>
            <input type="number" step="0.01" />
            <button class="param-apply">应用</button>
            <span class="param-current">—</span>
          </div>
          <div class="param-row" data-param="odom_y_scale">
            <label>odom_y_scale</label>
            <input type="number" step="0.01" />
            <button class="param-apply">应用</button>
            <span class="param-current">—</span>
          </div>
          <div class="param-row" data-param="odom_z_scale_positive">
            <label>odom_z_scale_positive</label>
            <input type="number" step="0.01" />
            <button class="param-apply">应用</button>
            <span class="param-current">—</span>
          </div>
          <div class="param-row" data-param="odom_z_scale_negative">
            <label>odom_z_scale_negative</label>
            <input type="number" step="0.01" />
            <button class="param-apply">应用</button>
            <span class="param-current">—</span>
          </div>
        </div>
        <p class="hint">提示：参数对静态变量生效需要重启机器人节点；odom_*_scale 在运行中可即时使用。</p>
      </div>
    </section>

    <section class="card">
      <h2>图表</h2>
      <div class="charts">
        <div class="chart-wrap"><canvas id="chart-voltage"></canvas></div>
        <div class="chart-wrap"><canvas id="chart-cmdvel"></canvas></div>
      </div>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
