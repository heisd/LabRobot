# ros2_control 控制器配置(Gazebo 仿真)
# 控制器名与 MoveIt 的 lm3_controllers.yaml 一致(lebai_trajectory_controller),
# 这样 move_group 在仿真里也能直接驱动机械臂。
controller_manager:
  ros__parameters:
    update_rate: 100  # Hz

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    lebai_trajectory_controller:
      type: joint_trajectory_controller/JointTrajectoryController

lebai_trajectory_controller:
  ros__parameters:
    joints:
      - lebai_joint_1
      - lebai_joint_2
      - lebai_joint_3
      - lebai_joint_4
      - lebai_joint_5
      - lebai_joint_6
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity
    allow_partial_joints_goal: false
    constraints:
      stopped_velocity_tolerance: 0.05
      goal_time: 2.0
